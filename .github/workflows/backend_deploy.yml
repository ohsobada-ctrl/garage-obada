name: Update notification backend
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/setup-database.mjs'
      - 'scripts/setup-push.mjs'
      - '.github/workflows/backend_deploy.yml'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: garage-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
      WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
      WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
      NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment authorization
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Configure the production environment's SUPABASE_ACCESS_TOKEN secret once to enable automatic deployment."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Apply and verify notification database repair
        run: npm run setup:database
      - name: Configure and deploy Web Push and its schedule
        run: npm run setup:push
