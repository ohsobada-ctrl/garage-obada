name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Validate Keystore & Prepare Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release.keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          fi

          if [ ! -f android/app/release.keystore ]; then
            echo "CRITICAL ERROR: release.keystore file missing!"
            exit 1
          fi

          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          [ -z "$KS_PASS" ] && KS_PASS="garage123456"
          KS_ALIAS="${{ secrets.KEY_ALIAS }}"
          [ -z "$KS_ALIAS" ] && KS_ALIAS="garage"

          keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "CRITICAL ERROR: Keystore password or alias verification failed!"
            exit 1
          fi
          echo "Release keystore validated successfully."

      - name: Build Release APK
        env:
          KEYSTORE_FILE: android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'garage123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'garage' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'garage123456' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Certificate SHA-256 Match with Keystore (apksigner)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'garage123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'garage' }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

          # Extract raw SHA-256 hex string from Keystore
          KEYSTORE_RAW=$(keytool -list -v -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
          KEYSTORE_HEX=$(echo "$KEYSTORE_RAW" | tr -d ': ' | tr '[:lower:]' '[:upper:]')

          # Extract raw SHA-256 hex string from Compiled APK using apksigner
          APK_RAW=$($APKSIGNER verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          APK_HEX=$(echo "$APK_RAW" | tr -d ': ' | tr '[:lower:]' '[:upper:]')

          FORMATTED_SHA256=$(echo "$KEYSTORE_HEX" | sed 's/../&:/g' | sed 's/:$//')

          echo "=================================================="
          echo "Package Name:        com.obada.garage.app"
          echo "Version Code:        2"
          echo "Version Name:        1.0.1"
          echo "Certificate SHA-256: $FORMATTED_SHA256"
          echo "=================================================="

          if [ -z "$APK_HEX" ] || [ "$KEYSTORE_HEX" != "$APK_HEX" ]; then
            echo "COMPARISON RESULT: FAIL ❌ (Keystore SHA-256 digest does NOT match APK certificate!)"
            exit 1
          fi

          echo "COMPARISON RESULT: MATCH 100% ✅ (Keystore SHA-256 matches compiled APK certificate)"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: garage-app-release
          path: android/app/build/outputs/apk/release/app-release.apk


