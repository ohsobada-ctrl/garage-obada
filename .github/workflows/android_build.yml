name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate and prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const name of ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']) {
            if (!process.env[name]) throw new Error(`Set ${name} in the production environment before building a release.`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'garage-release.keystore'), Buffer.from(process.env.KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          NODE

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Configure Android push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          if (!process.env.GOOGLE_SERVICES_JSON) throw new Error('Set GOOGLE_SERVICES_JSON in the production environment to enable Android push.');
          const config = JSON.parse(process.env.GOOGLE_SERVICES_JSON);
          if (!config.client?.some(client => client.client_info?.android_client_info?.package_name === 'com.obada.garage.app')) throw new Error('Firebase configuration belongs to a different Android application.');
          writeFileSync('android/app/google-services.json', JSON.stringify(config));
          NODE

      - name: Build Web App
        run: npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Validate signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/garage-release.keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "Keystore password or alias verification failed."
            exit 1
          fi
          echo "Release keystore validated successfully."

      - name: Build release APK and Play Store bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/garage-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK Certificate SHA-256 Match with Keystore (apksigner)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          # Extract raw SHA-256 hex string from Keystore
          KEYSTORE_RAW=$(keytool -list -v -keystore "$RUNNER_TEMP/garage-release.keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
          KEYSTORE_HEX=$(echo "$KEYSTORE_RAW" | tr -d ': ' | tr '[:lower:]' '[:upper:]')

          # Extract raw SHA-256 hex string from Compiled APK using apksigner
          APK_RAW=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          APK_HEX=$(echo "$APK_RAW" | tr -d ': ' | tr '[:lower:]' '[:upper:]')

          FORMATTED_SHA256=$(echo "$KEYSTORE_HEX" | sed 's/../&:/g' | sed 's/:$//')

          echo "=================================================="
          echo "Package Name:        com.obada.garage.app"
          echo "Certificate SHA-256: $FORMATTED_SHA256"
          echo "=================================================="

          if [ -z "$APK_HEX" ] || [ "$KEYSTORE_HEX" != "$APK_HEX" ]; then
            echo "COMPARISON RESULT: FAIL ❌ (Keystore SHA-256 digest does NOT match APK certificate!)"
            exit 1
          fi

          echo "COMPARISON RESULT: MATCH 100% ✅ (Keystore SHA-256 matches compiled APK certificate)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garage-app-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/garage-release.keystore"


